[project]
name = "kakeibo"
version = "0.1.0"
description = "Household budget web app for a couple (receipt-based expense splitting MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "mangum",
    "jinja2",
    "httpx",
    "pydantic",
    "itsdangerous",
    "python-ulid",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "moto[dynamodb,s3,server]",
    "boto3",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakeibo"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line too long (formatter handles)

[tool.pytest.ini_options]
testpaths = ["tests"]
